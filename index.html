<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #5f6b7f;
      --border: #d5dbe6;
      --primary: #3b5bdb;
      --primary-hover: #2f4bc0;
      --error: #d6336c;
      --ok: #2b8a3e;
      --focus: rgba(59, 91, 219, .25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151d;
        --card: #1a202b;
        --text: #e6e9ef;
        --muted: #9aa4b5;
        --border: #333c4c;
        --primary: #748ffc;
        --primary-hover: #91a7ff;
        --error: #f783ac;
        --ok: #69db7c;
        --focus: rgba(116, 143, 252, .3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      /* Imagen de fondo: cambia "fondo.svg" por tu propia foto (ej. fondo.jpg) */
      background: var(--bg) url("fondo.svg") center / cover no-repeat fixed;
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; text-align: center; }
    .subtitle { margin: 0 0 24px; color: var(--muted); text-align: center; }

    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }

    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }
    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--focus); }
    .field.invalid input { border-color: var(--error); }
    .error { display: none; color: var(--error); font-size: .85rem; margin-top: 4px; }
    .field.invalid .error { display: block; }

    #password { padding-right: 84px; }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: none; color: var(--primary); font: inherit; font-size: .85rem;
      cursor: pointer; padding: 6px 8px; border-radius: 6px;
    }
    .toggle:focus-visible { outline: 2px solid var(--primary); }

    .caps { display: none; color: #f08c00; font-size: .85rem; margin-top: 4px; }
    .caps.show { display: block; }

    .alert {
      display: none; margin-bottom: 18px; padding: 10px 12px; border-radius: 8px;
      font-size: .9rem; color: var(--error); border: 1px solid var(--error);
    }
    .alert.show { display: block; }

    button[type="submit"] {
      width: 100%; padding: 13px;
      font: inherit; font-weight: 600; color: #fff;
      background: var(--primary); border: 0; border-radius: 8px; cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    button[type="submit"]:hover { background: var(--primary-hover); }
    button[type="submit"]:disabled { opacity: .6; cursor: wait; }

    .success { display: none; text-align: center; }
    .success .icon {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
      background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 2rem;
    }
    .success button {
      margin-top: 8px; padding: 10px 18px; font: inherit; border-radius: 8px;
      border: 1.5px solid var(--border); background: none; color: var(--text); cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="formView">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Introduce tu usuario y contraseña</p>

      <div class="alert" id="alert" role="alert"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>
          <div class="error" id="usuario-error">Escribe tu usuario.</div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="togglePass" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <div class="caps" id="caps">Bloq Mayús está activado</div>
          <div class="error" id="password-error">Escribe tu contraseña.</div>
        </div>

        <button type="submit" id="submitBtn">Entrar</button>
      </form>
    </section>

    <section class="success" id="successView" role="status" aria-live="polite">
      <div class="icon">✓</div>
      <h1>¡Hola, <span id="successName"></span>!</h1>
      <p class="subtitle">Has iniciado sesión correctamente.</p>
      <button type="button" id="logoutBtn">Cerrar sesión</button>
    </section>
  </main>

  <script>
    const form = document.getElementById('form');
    const usuario = document.getElementById('usuario');
    const pass = document.getElementById('password');
    const alertBox = document.getElementById('alert');

    function validate(el) {
      const ok = el.value.trim() !== '';
      el.closest('.field').classList.toggle('invalid', !ok);
      el.setAttribute('aria-invalid', String(!ok));
      el.setAttribute('aria-describedby', ok ? '' : el.id + '-error');
      return ok;
    }

    // Quitar el error en cuanto el usuario empieza a corregir
    [usuario, pass].forEach(el => el.addEventListener('input', () => {
      if (el.closest('.field').classList.contains('invalid')) validate(el);
      alertBox.classList.remove('show');
    }));

    // Mostrar / ocultar contraseña
    const toggle = document.getElementById('togglePass');
    toggle.addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Ocultar' : 'Mostrar';
      toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      pass.focus();
    });

    // Aviso de Bloq Mayús
    const caps = document.getElementById('caps');
    ['keydown', 'keyup'].forEach(evt => pass.addEventListener(evt, e => {
      caps.classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
    }));
    pass.addEventListener('blur', () => caps.classList.remove('show'));

    form.addEventListener('submit', e => {
      e.preventDefault();
      const okUser = validate(usuario);
      const okPass = validate(pass);
      if (!okUser) return usuario.focus();
      if (!okPass) return pass.focus();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      // Simula la petición al servidor; sustitúyelo por un fetch a tu API
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        document.getElementById('successName').textContent = usuario.value.trim();
        document.getElementById('formView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      }, 800);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      form.reset();
      pass.type = 'password';
      toggle.textContent = 'Mostrar';
      document.getElementById('successView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
      usuario.focus();
    });
  </script>
</body>
</html>
